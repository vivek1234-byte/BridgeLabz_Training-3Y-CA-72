<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2: Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <header>
        <h1>Q2: CSS Tooltips</h1>
    </header>
    <main class="tooltip-container">
        <div class="tooltip-wrapper">
            <span class="icon">ℹ️</span>
            <div class="tooltip">Information icon tooltip</div>
        </div>
        
        <div class="tooltip-wrapper">
            <button class="hover-btn">Hover over me</button>
            <div class="tooltip">This is a button tooltip!</div>
        </div>
        
        <p>You can also add tooltips to <span class="tooltip-wrapper inline-word">specific words<span class="tooltip">Definition of the word</span></span> in a paragraph.</p>
    </main>
</body>
</html>
