<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3: Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Q3: Image Showcase Layout</h1>
    </header>
    <main class="gallery">
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/FF5733/FFFFFF?text=Image+1" alt="Showcase 1">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Sunset</figcaption>
        </figure>
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/33FF57/FFFFFF?text=Image+2" alt="Showcase 2">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest Trail</figcaption>
        </figure>
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/3357FF/FFFFFF?text=Image+3" alt="Showcase 3">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/F3FF33/333333?text=Image+4" alt="Showcase 4">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Peak</figcaption>
        </figure>
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/FF33F6/FFFFFF?text=Image+5" alt="Showcase 5">
                <div class="overlay"></div>
            </div>
            <figcaption>City Lights</figcaption>
        </figure>
        <figure class="image-card">
            <div class="img-wrapper">
                <img src="https://via.placeholder.com/400x300/33FFF6/333333?text=Image+6" alt="Showcase 6">
                <div class="overlay"></div>
            </div>
            <figcaption>Desert Dunes</figcaption>
        </figure>
    </main>
</body>
</html>
