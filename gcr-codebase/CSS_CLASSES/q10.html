<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q10: Complete Mini UI Layout</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
    <div class="layout-wrapper">
        <header class="app-header">
            <h2>MyApp</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="main-card">
                <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
                <h3>Welcome Back</h3>
                <form class="login-form">
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Log In</button>
                </form>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2023 MyApp Inc.</p>
        </footer>
    </div>
</body>
</html>
