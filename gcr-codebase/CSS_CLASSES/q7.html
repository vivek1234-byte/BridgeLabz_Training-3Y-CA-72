<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7: UI Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
    <main class="ui-container">
        <h2>Dashboard Elements</h2>
        
        <div class="search-bar-wrapper">
            <input type="text" class="ui-input search-input" placeholder="Search...">
            <button class="ui-btn">Search</button>
        </div>

        <div class="dropdown-wrapper">
            <label for="options">Select Option:</label>
            <select id="options" class="ui-input dropdown">
                <option>Option 1</option>
                <option>Option 2</option>
                <option>Option 3</option>
            </select>
        </div>
        
        <div class="action-buttons">
            <button class="ui-btn secondary">Cancel</button>
            <button class="ui-btn">Save Changes</button>
        </div>
    </main>
</body>
</html>
