<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6: CSS Animation</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <header>
        <h1>Q6: CSS Animation Demonstration</h1>
    </header>
    <main class="animation-container">
        <!-- Element 1: Moving Box -->
        <div class="anim-element moving-box">Moving Box</div>

        <!-- Element 2: Bouncing Ball -->
        <div class="anim-element bouncing-ball"></div>

        <!-- Element 3: Color Changing Text -->
        <div class="anim-element color-text">Color Changing Text!</div>
    </main>
</body>
</html>
