<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 6 &mdash; CSS-only Photo Gallery</title>
  <link rel="stylesheet" href="q06-gallery.css">
</head>
<body>

  <header class="page-head">
    <h1>Field notes</h1>
    <p>Six frames from a week of walking. Hover or tap a frame to read the note.</p>
  </header>

  <main>
    <div class="gallery">

      <figure class="tile">
        <img src="images/gallery-1.svg" alt="Abstract study in deep blue and gold">
        <figcaption class="caption">
          <span class="caption-title">Morning, north bank</span>
          <span class="caption-note">Shot before the light hardened.</span>
        </figcaption>
      </figure>

      <figure class="tile">
        <img src="images/gallery-2.svg" alt="Abstract study in green and sand">
        <figcaption class="caption">
          <span class="caption-title">Terrace steps</span>
          <span class="caption-note">Third attempt; the first two were flat.</span>
        </figcaption>
      </figure>

      <figure class="tile">
        <img src="images/gallery-3.svg" alt="Abstract study in slate and grey">
        <figcaption class="caption">
          <span class="caption-title">After rain</span>
          <span class="caption-note">Everything went one stop darker.</span>
        </figcaption>
      </figure>

      <figure class="tile">
        <img src="images/gallery-4.svg" alt="Abstract study in teal and cream">
        <figcaption class="caption">
          <span class="caption-title">The long wall</span>
          <span class="caption-note">Waited eleven minutes for the shadow.</span>
        </figcaption>
      </figure>

      <figure class="tile">
        <img src="images/gallery-5.svg" alt="Abstract study in violet and amber">
        <figcaption class="caption">
          <span class="caption-title">Last light</span>
          <span class="caption-note">Handheld, and it shows at full size.</span>
        </figcaption>
      </figure>

      <figure class="tile">
        <img src="images/gallery-6.svg" alt="Abstract study in petrol blue and pale green">
        <figcaption class="caption">
          <span class="caption-title">Empty platform</span>
          <span class="caption-note">Two minutes before the 6:40 arrived.</span>
        </figcaption>
      </figure>

    </div>
  </main>

  <footer class="page-foot">
    <p>Assignment 5, Question 6 &middot; Responsive gallery with hover overlays</p>
  </footer>

</body>
</html>
