<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Google Map Embed</title>
</head>
<body>
    <!-- Q2: Embedding a Google Map of my city (Delhi) using an iframe -->
    <h1>Map of My City - Delhi</h1>
    <!--
        The loading="lazy" attribute tells the browser to delay loading
        the iframe until the user scrolls near it. This improves the
        initial page load speed and saves bandwidth.
    -->
    <iframe
        src="https://www.google.com/maps?q=Delhi,India&output=embed"
        title="Google Map showing Delhi"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
