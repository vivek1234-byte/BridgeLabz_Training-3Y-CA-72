<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q11 - Student Information Form</title>
</head>
<body>
    <!-- Q11: Student information form with a select dropdown for course -->
    <h1>Student Information Form</h1>
    <form action="#" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="course">Course:</label><br>
        <!-- The first option is disabled and selected so it acts as a default prompt -->
        <select id="course" name="course" required>
            <option value="" disabled selected>Select Course</option>
            <option value="bca">BCA</option>
            <option value="bsc">B.Sc Computer Science</option>
            <option value="btech">B.Tech</option>
            <option value="bcom">B.Com</option>
        </select><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
