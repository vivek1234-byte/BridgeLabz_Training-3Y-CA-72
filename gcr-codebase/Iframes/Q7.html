<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Login Form with CSRF Token</title>
</head>
<body>
    <!-- Q7: Login Form with a hidden CSRF token field -->
    <h1>Login Form</h1>
    <!--
        Purpose of a CSRF token:
        A CSRF (Cross-Site Request Forgery) token is a secret, unique value
        generated by the server and placed in the form as a hidden field.
        When the form is submitted, the server checks that the token matches
        the one it issued. This ensures the request genuinely came from the
        website's own form and not from a malicious third-party site trying
        to submit requests on behalf of a logged-in user.
    -->
    <form action="#" method="post">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Hidden CSRF token field with a dummy value -->
        <input type="hidden" name="csrf_token" value="a1b2c3d4e5f6g7h8dummy_token_9i0j">

        <input type="submit" value="Login">
    </form>
</body>
</html>
