<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title: sets the text shown in the browser tab and used by search engines -->
    <title>Q20 - Important Head Elements</title>

    <!-- meta charset: defines the character encoding so all characters display correctly -->
    <meta charset="UTF-8">

    <!-- meta description: gives search engines a short summary of the page -->
    <meta name="description" content="A demonstration page showing all important head elements in HTML.">

    <!-- meta author: names the person who created the page -->
    <meta name="author" content="Kunal">

    <!-- base: sets the base URL for all relative links on the page -->
    <base href="https://www.example.com/">

    <!-- link: connects external resources to the page, such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style: holds internal CSS rules (left empty as per assignment) -->
    <style></style>

    <!-- script: holds JavaScript code (left empty as per assignment) -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page demonstrates the title, meta, base, link, style, and script tags. Open the page source to see the comments explaining each tag.</p>
</body>
</html>
