<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q12 - HTML Entities</title>
</head>
<body>
    <!-- Q12: Demonstrating HTML entities for special characters and symbols -->
    <h1>HTML Entities Demonstration</h1>
    <p>
        Less than sign: &lt;<br>
        Greater than sign: &gt;<br>
        Ampersand: &amp;<br>
        Double quote: &quot;<br>
        Single quote (apostrophe): &apos;<br>
        Copyright symbol: &copy;<br>
        Trademark symbol: &trade;<br>
        Registered trademark symbol: &reg;
    </p>
</body>
</html>
