<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q14 - Embedding an External Website</title>
</head>
<body>
    <!-- Q14: Embedding an external website using an iframe -->
    <h1>External Website Embed</h1>
    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia Homepage"
        width="800"
        height="500">
    </iframe>
    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
