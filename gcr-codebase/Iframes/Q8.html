<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Feedback Form</title>
</head>
<body>
    <!-- Q8: Feedback Form with textarea, radio buttons, and submit button -->
    <h1>Feedback Form</h1>
    <form method="post" action="#">
        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40"></textarea><br><br>

        <!-- Radio buttons for rating -->
        <p>Rate our service:</p>
        <input type="radio" id="good" name="rating" value="good">
        <label for="good">Good</label><br>

        <input type="radio" id="average" name="rating" value="average">
        <label for="average">Average</label><br>

        <input type="radio" id="poor" name="rating" value="poor">
        <label for="poor">Poor</label><br><br>

        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
