<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q1 - YouTube Video Embed</title>
</head>
<body>
    <!-- Q1: Embedding a YouTube video using an iframe -->
    <!-- Width and height are set in percentages so the video resizes with the browser window -->
    <h1>Embedded YouTube Video</h1>
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="YouTube Video Player">
    </iframe>
</body>
</html>
