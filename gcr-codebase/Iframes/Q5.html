<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Q5: Complete head section with meta tags -->
    <!-- charset UTF-8 allows characters from all languages to display correctly -->
    <meta charset="UTF-8">
    <!-- author meta tag names the creator of the page -->
    <meta name="author" content="Kunal">
    <!-- viewport meta tag makes the page scale properly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Head Section and UTF-8 Test</title>
</head>
<body>
    <h1>UTF-8 Encoding Test</h1>
    <!-- Paragraph with English, Hindi, and Japanese text to verify UTF-8 -->
    <p>
        English: Hello, welcome to my website!<br>
        Hindi: नमस्ते, मेरी वेबसाइट पर आपका स्वागत है!<br>
        Japanese: こんにちは、私のウェブサイトへようこそ！
    </p>
</body>
</html>
