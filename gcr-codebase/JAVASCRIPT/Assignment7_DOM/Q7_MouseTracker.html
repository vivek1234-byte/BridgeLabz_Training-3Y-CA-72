<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Path Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #trackingBox { width: 400px; height: 400px; border: 2px solid #333; position: relative; background: #fafafa; cursor: crosshair; overflow: hidden; }
        .dot { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #coordinates { margin-top: 12px; font-family: monospace; font-size: 16px; }
        button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Mouse Tracker</h1>
    <p>Move the mouse inside the box. Double-click to drop a red dot.</p>
    <div id="trackingBox"></div>
    <div id="coordinates">clientX: -, clientY: -</div>
    <button id="clearDots">Clear dots</button>
    <script src="Q7_MouseTracker.js"></script>
</body>
</html>
