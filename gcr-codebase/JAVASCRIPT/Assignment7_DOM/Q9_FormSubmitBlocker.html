<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submit Blocker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
        input.invalid { border-color: red; }
        .error { color: red; font-size: 13px; min-height: 16px; margin-top: 3px; }
        button { padding: 8px 18px; cursor: pointer; }
        #successMessage { display: none; margin-top: 14px; padding: 10px; background: #e3f7e3; color: #1b6b1b; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Sign Up</h1>
    <form id="signupForm" action="#" novalidate>
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <div class="error" id="nameError"></div>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
            <div class="error" id="emailError"></div>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <div class="error" id="passwordError"></div>
        </div>
        <button type="submit">Submit</button>
    </form>
    <div id="successMessage">Form Submitted Successfully</div>
    <script src="Q9_FormSubmitBlocker.js"></script>
</body>
</html>
