<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3: Gradient Background</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header class="fixed-header">
        <h1>Q3: Gradient Background Webpage</h1>
    </header>

    <main>
        <section class="linear-section">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>This section uses a linear gradient from top-left to bottom-right.</p>
            </div>
        </section>
        
        <section class="radial-section">
            <div class="content">
                <h2>Radial Gradient (Parallax)</h2>
                <p>This section features a fixed radial gradient, creating a parallax-like effect as you scroll.</p>
            </div>
        </section>
    </main>

    <footer class="fixed-footer">
        <p>&copy; 2023 Gradients Layout</p>
    </footer>
</body>
</html>
