<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q5: Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header>
        <h1 class="title">Q5: Advanced CSS Selectors</h1>
    </header>
    <main>
        <section class="form-section">
            <input type="text" placeholder="Type here...">
            <input type="password" placeholder="Ignored input">
            <a href="https://example.com" class="secure-link">Secure Link</a>
            <a href="http://example.com">Insecure Link</a>
        </section>
        
        <section class="list-section">
            <ul class="item-list">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
            </ul>
        </section>

        <section class="combinator-section">
            <div class="parent">
                <p>Child P 1</p>
                <span>Child Span</span>
                <p>Child P 2</p>
                <div class="nested">
                    <p>Descendant P</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
