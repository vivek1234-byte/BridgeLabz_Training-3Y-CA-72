<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6: CSS Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <header>
        <h1>Q6: CSS Transformations Showcase</h1>
    </header>
    <main class="transform-container">
        <div class="box-wrapper">
            <div class="transform-box box-rotate">Rotate</div>
            <p class="label">rotate(45deg)</p>
        </div>
        <div class="box-wrapper">
            <div class="transform-box box-scale">Scale</div>
            <p class="label">scale(1.5)</p>
        </div>
        <div class="box-wrapper">
            <div class="transform-box box-translate">Translate</div>
            <p class="label">translate(0, -20px)</p>
        </div>
        <div class="box-wrapper">
            <div class="transform-box box-skew">Skew</div>
            <p class="label">skewX(20deg)</p>
        </div>
    </main>
</body>
</html>
