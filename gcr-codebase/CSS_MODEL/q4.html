<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4: Shadows and Depth Effect</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>
    <header>
        <h1>Q4: Shadows and Depth Effect</h1>
    </header>
    <main class="card-container">
        <article class="card shadow-light">
            <h2 class="shadow-heading">Basic Plan</h2>
            <p>A simple card with a light shadow.</p>
        </article>
        <article class="card shadow-medium">
            <h2 class="shadow-heading">Pro Plan</h2>
            <p>A standard card with a medium spread shadow.</p>
        </article>
        <article class="card shadow-heavy">
            <h2 class="shadow-heading">Enterprise</h2>
            <p>An elevated card with a heavy, diffuse shadow.</p>
        </article>
    </main>
</body>
</html>
