<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 - Product Gallery with CSS Grid</title>
  <link rel="stylesheet" href="Q2.css">
</head>
<body>

  <header class="page-head">
    <h1>Stationery store</h1>
    <p>Eight items, four columns on desktop.</p>
  </header>

  <main>
    <section class="gallery">

      <article class="card">
        <div class="thumb thumb-a"></div>
        <h2 class="name">Ruled notebook</h2>
        <p class="price">&#8377; 120</p>
      </article>

      <article class="card">
        <div class="thumb thumb-b"></div>
        <h2 class="name">Gel pen set of five, blue and black ink</h2>
        <p class="price">&#8377; 90</p>
      </article>

      <article class="card">
        <div class="thumb thumb-c"></div>
        <h2 class="name">Geometry box</h2>
        <p class="price">&#8377; 210</p>
      </article>

      <article class="card">
        <div class="thumb thumb-d"></div>
        <h2 class="name">Sticky notes</h2>
        <p class="price">&#8377; 65</p>
      </article>

      <article class="card">
        <div class="thumb thumb-b"></div>
        <h2 class="name">A4 sketch pad, 100 sheets</h2>
        <p class="price">&#8377; 340</p>
      </article>

      <article class="card">
        <div class="thumb thumb-a"></div>
        <h2 class="name">Desk lamp</h2>
        <p class="price">&#8377; 1,150</p>
      </article>

      <article class="card">
        <div class="thumb thumb-d"></div>
        <h2 class="name">Highlighter pack</h2>
        <p class="price">&#8377; 145</p>
      </article>

      <article class="card">
        <div class="thumb thumb-c"></div>
        <h2 class="name">Canvas pencil pouch with two zip compartments</h2>
        <p class="price">&#8377; 275</p>
      </article>

    </section>
  </main>

</body>
</html>
