<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Card Flip Animation</title>
  <link rel="stylesheet" href="Q9.css">
</head>
<body>

  <main class="stage">
    <div class="card" tabindex="0">
      <div class="card-inner">

        <div class="face front">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='%230f2d3d'/><path d='M0 230 L110 130 L190 200 L280 90 L400 210 L400 300 L0 300 Z' fill='%236b8f9c'/><circle cx='310' cy='70' r='36' fill='%23d98b3a'/></svg>" alt="Illustration of hills at sunrise">
          <h2>Kumaon hills</h2>
          <p class="hint">Hover to read more</p>
        </div>

        <div class="face back">
          <h2>Kumaon hills</h2>
          <p>
            A three day walk from Kausani to Binsar, mostly through pine forest.
            The best light is just after five in the morning, when the ridge line
            turns orange before the valley below has woken up.
          </p>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
