<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Photo Gallery with Grid</title>
  <link rel="stylesheet" href="Q8.css">
</head>
<body>

  <header class="page-head">
    <h1>Photo gallery</h1>
    <p>The columns fit themselves to the width of the screen.</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%230f2d3d'/><circle cx='180' cy='170' r='90' fill='%23d98b3a'/><rect x='0' y='330' width='600' height='120' fill='%23d98b3a' opacity='0.35'/></svg>" alt="Morning at the ghat">
        <figcaption>Morning at the ghat</figcaption>
      </figure>
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%238a4b46'/><circle cx='220' cy='170' r='90' fill='%23f2ede4'/><rect x='0' y='330' width='600' height='120' fill='%23f2ede4' opacity='0.35'/></svg>" alt="Rooftop kites">
        <figcaption>Rooftop kites</figcaption>
      </figure>
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%236b8f9c'/><circle cx='260' cy='170' r='90' fill='%230f2d3d'/><rect x='0' y='330' width='600' height='120' fill='%230f2d3d' opacity='0.35'/></svg>" alt="Old library steps">
        <figcaption>Old library steps</figcaption>
      </figure>
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%23d98b3a'/><circle cx='300' cy='170' r='90' fill='%238a4b46'/><rect x='0' y='330' width='600' height='120' fill='%238a4b46' opacity='0.35'/></svg>" alt="Market at noon">
        <figcaption>Market at noon</figcaption>
      </figure>
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%23264653'/><circle cx='340' cy='170' r='90' fill='%236b8f9c'/><rect x='0' y='330' width='600' height='120' fill='%236b8f9c' opacity='0.35'/></svg>" alt="Monsoon courtyard">
        <figcaption>Monsoon courtyard</figcaption>
      </figure>
      <figure class="item">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'><rect width='100%' height='100%' fill='%234d585f'/><circle cx='380' cy='170' r='90' fill='%23d98b3a'/><rect x='0' y='330' width='600' height='120' fill='%23d98b3a' opacity='0.35'/></svg>" alt="Last train home">
        <figcaption>Last train home</figcaption>
      </figure>
    </section>
  </main>

</body>
</html>
