<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 - Three Section Homepage with Flexbox</title>
  <link rel="stylesheet" href="Q3.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="#services">Services</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <a href="#blog">Blog</a>
    </nav>
  </header>

  <main class="main">
    <div class="box" id="services">
      <h2>Services</h2>
      <p>Website design, small business landing pages and basic SEO setup.</p>
    </div>

    <div class="box" id="projects">
      <h2>Projects</h2>
      <p>A school result portal, a recipe archive and this assignment set.</p>
    </div>

    <div class="box" id="contact">
      <h2>Contact</h2>
      <p>Write to hello@example.com or call between 10am and 6pm.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Studio Homepage. Built with Flexbox.</p>
  </footer>

</body>
</html>
