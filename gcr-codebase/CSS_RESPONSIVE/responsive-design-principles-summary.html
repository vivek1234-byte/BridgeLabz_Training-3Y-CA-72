<body>
<header><h1>Responsive Design Principles</h1></header><main class="principles"><article><h2>Fluid Layouts</h2><p>Use flexible widths instead of fixed page sizes.</p><pre>width: 100%;</pre></article><article><h2>Flexible Media</h2><p>Images should shrink with their containers.</p><pre>img { max-width: 100%; }</pre></article><article><h2>Breakpoints</h2><p>Change the layout when the available space becomes limited.</p><pre>@media (max-width: 600px)</pre></article></main>
</body>
