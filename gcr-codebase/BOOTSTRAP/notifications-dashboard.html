<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="notifications-dashboard.css"></head><body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><header class="mb-4"><h1 class="h2 fw-bold">Notifications</h1><p class="text-secondary mb-0">A quick look at what needs your attention.</p></header><section class="card border-0 shadow-sm p-4"><div class="alert alert-success" role="alert"><strong>New message:</strong> Your project review has been received.</div><div class="alert alert-info" role="alert"><strong>Tip:</strong> You can pin important tasks from the dashboard.</div><div class="alert alert-danger" role="alert"><strong>Warning:</strong> Your storage is almost full.</div><div class="alert alert-warning alert-dismissible fade show" role="alert"><strong>Reminder:</strong> Update your profile before Friday.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div><div class="summary p-4 bg-light border rounded-3"><h2 class="h5">Summary</h2><div class="row text-center g-3"><div class="col-sm-4"><strong class="fs-4">12</strong><div class="text-secondary">New messages</div></div><div class="col-sm-4"><strong class="fs-4">4</strong><div class="text-secondary">Tasks due</div></div><div class="col-sm-4"><strong class="fs-4">2</strong><div class="text-secondary">Warnings</div></div></div></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
