<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="task-tracker-with-badges.css"></head><body><main class="container py-5"><header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="text-secondary mb-1">Monday workspace</p><h1 class="h2 mb-0">Task Tracker</h1></div><span class="badge text-bg-dark fs-6">5 pending</span></header><section class="list-group shadow-sm"><div class="list-group-item d-flex justify-content-between align-items-center"><span>Finish homepage layout</span><span class="badge text-bg-danger">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Review API notes</span><span class="badge text-bg-warning">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Update README</span><span class="badge text-bg-success">Low</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Test mobile layout</span><span class="badge text-bg-warning">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Clean old branches</span><span class="badge text-bg-success">Low</span></div></section><button class="btn btn-primary mt-4">Completed <span class="badge text-bg-light text-dark">8</span></button></main></body></html>
